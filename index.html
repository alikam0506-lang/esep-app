      <input id="f-stock" type="text" inputmode="numeric" value="${p.stock}" placeholder="0">
    </div>
    <div id="total-cost-preview" class="ledger-card" style="margin:-6px 0 14px; display:none;">
      <div class="receipt-total">
        <span class="label" style="font-size:13px;">${t('total_cost_preview_prefix')}</span>
        <span class="value" style="font-size:17px;" id="total-cost-value"></span>
      </div>
    </div>
    <div class="field">
      <label>${t('supplier_payment_label')}</label>
      <div class="pay-option ${payment==='cash'?'active':''}" data-fpay="cash">${ICONS.cash}<span class="t">${t('paid_cash_label')}</span></div>
      <div class="pay-option ${payment==='debt'?'active':''}" data-fpay="debt">${ICONS.debtc}<span class="t">${t('taken_on_debt_label')}</span></div>
    </div>
    <div class="field">
      <label>${t('supplier_optional_label')}</label>
      ${state.suppliers.length ? `
        <select id="f-supplier">
          <option value="">${t('no_supplier_option')}</option>
          ${supplierOptions}
        </select>
      ` : `<input id="f-supplier-text" type="text" value="${p.supplier||''}">`}
    </div>
    ${existing ? renderPriceHistorySection(existing.id) : ''}
    <button class="btn-full" id="save-product">${ICONS.check} ${t('save_btn')}</button>
    ${existing ? `<div style="height:8px;"></div><button class="btn-ghost" id="delete-product" style="color:var(--debt); border-color:var(--debt-soft);">${t('delete_product_btn')}</button>` : ''}
  `);

  const costInput = document.getElementById('f-cost');
  const priceInput = document.getElementById('f-price');
  const stockInput = document.getElementById('f-stock');
  const marginEl = document.getElementById('margin-preview');
  const totalCostBox = document.getElementById('total-cost-preview');
  const totalCostValueEl = document.getElementById('total-cost-value');
  function updateMarginPreview(){
    const cost = parseFloat(costInput.value) || 0;
    const price = parseFloat(priceInput.value) || 0;
    if(cost>0 && price>0){
      const margin = Math.round(((price-cost)/cost)*100);
      const profit = price - cost;
      marginEl.style.color = margin>=0 ? 'var(--primary)' : 'var(--debt)';
      marginEl.textContent = `${t('margin_preview_prefix')} ${margin>=0?'+':''}${margin}% (${fmt(profit)})`;
    } else {
      marginEl.textContent = '';
    }
  }
  function updateTotalCostPreview(){
    const cost = parseFloat(costInput.value) || 0;
    const stock = parseInt(stockInput.value) || 0;
    if(cost>0 && stock>0){
      totalCostBox.style.display = 'block';
      totalCostValueEl.textContent = `${fmt(cost)} × ${stock} = ${fmt(cost*stock)}`;
    } else {
      totalCostBox.style.display = 'none';
    }
  }
  costInput.addEventListener('input', ()=>{ updateMarginPreview(); updateTotalCostPreview(); });
  priceInput.addEventListener('input', updateMarginPreview);
  stockInput.addEventListener('input', updateTotalCostPreview);
  updateMarginPreview();
  updateTotalCostPreview();

  document.querySelectorAll('[data-fpay]').forEach(b=>b.addEventListener('click', ()=>{
    payment = b.dataset.fpay;
    document.querySelectorAll('[data-fpay]').forEach(x=>x.classList.toggle('active', x.dataset.fpay===payment));
  }));

  document.getElementById('save-product').onclick = async () => {
    const name = document.getElementById('f-name').value.trim();
    const category = document.getElementById('f-category').value.trim() || t('default_category');
    const costPrice = parseFloat(document.getElementById('f-cost').value) || 0;
    const price = parseFloat(document.getElementById('f-price').value) || 0;
    const stock = parseInt(document.getElementById('f-stock').value) || 0;
    if(!name){ showToast(t('toast_enter_name')); return; }
    let supplier = '';
    const supSel = document.getElementById('f-supplier');
    const supText = document.getElementById('f-supplier-text');
    if(supSel) supplier = supSel.value;
    else if(supText) supplier = supText.value.trim();

    let productId;
    if(existing){
      const idx = state.products.findIndex(x=>x.id===existing.id);
      if(price!==existing.price || costPrice!==existing.costPrice){
        state.priceChanges.push({
          id: uid(), date: nowISO(), productId: existing.id, productName: name,
          oldPrice: existing.price, newPrice: price,
          oldCostPrice: existing.costPrice||0, newCostPrice: costPrice
        });
      }
      state.products[idx] = {...existing, name, category, costPrice, price, stock, supplier, payment};
      productId = existing.id;
      /* Editing an existing product never creates a new debt/purchase record —
         that was the bug: every save (even for unrelated fields like category)
         used to add a fresh phantom debt for the full current stock. Adding
         genuinely new stock belongs in "Приход" (openStockInSheet), which
         already logs its own purchase entry correctly. */
    } else {
      productId = uid();
      state.products.push({id:productId, name, category, costPrice, price, stock, supplier, payment});
      if(costPrice>0 && stock>0){
        state.purchases.push({
          id: uid(), date: nowISO(), productId, productName: name,
          qty: stock, costPrice, totalCost: costPrice*stock, paidAmount: 0,
          supplier, payment, status: payment==='debt' ? 'debt' : 'paid'
        });
      }
    }

    await saveData();
    closeSheet();
    render();
    showToast(t('toast_saved'));
  };

  if(existing){
    document.getElementById('delete-product').onclick = async () => {
      state.purchases.filter(pu=>pu.productId===existing.id).forEach(pu=>{
        removePurchaseFromSupplierPayments(pu.id);
      });
      state.purchases = state.purchases.filter(x=>x.productId!==existing.id);
      state.priceChanges = state.priceChanges.filter(x=>x.productId!==existing.id);
      state.products = state.products.filter(x=>x.id!==existing.id);
      delete cart[existing.id];
      await saveData();
      closeSheet();
      render();
      showToast(t('toast_product_deleted'));
    };
  }
}

function openReturnItemsSheet(saleId){
  const s = state.sales.find(x=>x.id===saleId);
  if(!s) return;
  window._returnDraft = {};
  let returnCondition = 'valid';
  openSheet(`
    <div class="sheet-head">
      <h2>${t('return_items_title')}</h2>
      <button data-action="close-sheet">${ICONS.x}</button>
    </div>
    <div class="screen-sub" style="margin:-8px 0 12px;">${s.customer || t('default_customer')} · ${new Date(s.date).toLocaleDateString('ru-RU')}</div>
    <div class="card" id="return-items-card">
      ${s.items.map((i,idx)=>`
        <div class="pick-item">
          <div class="info">
            <div class="name">${i.name}</div>
            <div class="price">${fmt(i.price)} · ${t('sold_suffix')} ${i.qty}</div>
          </div>
          <div class="stepper">
            <button data-action="ret-dec" data-idx="${idx}">−</button>
            <span id="ret-qty-${idx}">0</span>
            <button data-action="ret-inc" data-idx="${idx}" data-max="${i.qty}">+</button>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="section-head"><h3>${t('return_condition_title')}</h3></div>
    <div class="pay-option active" data-condition="valid" id="condition-valid-opt">${ICONS.check}<span class="t">${t('condition_valid_label')} — ${t('condition_valid_desc')}</span></div>
    <div class="pay-option" data-condition="invalid" id="condition-invalid-opt">${ICONS.x}<span class="t">${t('condition_invalid_label')} — ${t('condition_invalid_desc')}</span></div>

    <div class="ledger-card" style="margin-top:14px;">
      <div class="receipt-total">
        <span class="label">${t('return_total_label')}</span>
        <span class="value" id="return-total">${fmt(0)}</span>
      </div>
    </div>
    <div style="height:14px;"></div>
    <button class="btn-full" id="confirm-return" disabled>${ICONS.check} ${t('confirm_return_btn')}</button>
  `);

  document.querySelectorAll('[data-condition]').forEach(b=>b.addEventListener('click', ()=>{
    returnCondition = b.dataset.condition;
    document.querySelectorAll('[data-condition]').forEach(x=>x.classList.toggle('active', x.dataset.condition===returnCondition));
  }));

  function recalc(){
    let total = 0;
    let any = false;
    s.items.forEach((i,idx)=>{
      const q = window._returnDraft[idx]||0;
      total += q*i.price;
      if(q>0) any = true;
    });
    document.getElementById('return-total').textContent = fmt(total);
    document.getElementById('confirm-return').disabled = !any;
  }

  document.querySelectorAll('[data-action="ret-inc"]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = b.dataset.idx, max = parseInt(b.dataset.max);
    const cur = window._returnDraft[idx]||0;
    if(cur<max){ window._returnDraft[idx]=cur+1; document.getElementById('ret-qty-'+idx).textContent = cur+1; recalc(); }
  }));
  document.querySelectorAll('[data-action="ret-dec"]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = b.dataset.idx;
    const cur = window._returnDraft[idx]||0;
    if(cur>0){ window._returnDraft[idx]=cur-1; document.getElementById('ret-qty-'+idx).textContent = cur-1; recalc(); }
  }));

  document.getElementById('confirm-return').onclick = async () => {
    const returnedItems = [];
    let amount = 0;
    s.items.forEach((i,idx)=>{
      const q = window._returnDraft[idx]||0;
      if(q>0){
        returnedItems.push({productId:i.productId, name:i.name, price:i.price, qty:q});
        amount += q*i.price;
        i.qty -= q;
        if(returnCondition==='valid'){
          const p = state.products.find(x=>x.id===i.productId);
          if(p) p.stock += q;
        }
      }
    });
    s.items = s.items.filter(i=>i.qty>0);
    s.total = Math.max(0, s.total - amount);
    if(s.items.length===0) s.status = 'returned';
    state.returns.push({id:uid(), date:nowISO(), saleId:s.id, customer:s.customer, items:returnedItems, amount, condition:returnCondition});
    await saveData();
    closeSheet();
    render();
    const totalReturnedQty = returnedItems.reduce((sum,i)=>sum+i.qty,0);
    showToast(`${t('toast_return_done_prefix')} ${fmt(amount)} (${totalReturnedQty} ${t('unit_suffix')})`);
  };
}

  const siTotalValueEl = document.getElementById('total-cost-value');
  function updateStockInTotalPreview(){
    const qty = parseInt(siQtyInput.value) || 0;
    const cost = parseFloat(siCostInput.value) || 0;
    if(qty>0 && cost>0){
      siTotalBox.style.display = 'block';
      siTotalValueEl.textContent = `${fmt(cost)} × ${qty} = ${fmt(cost*qty)}`;
    } else {
      siTotalBox.style.display = 'none';
    }
  }
  siQtyInput.addEventListener('input', updateStockInTotalPreview);
  siCostInput.addEventListener('input', updateStockInTotalPreview);
  const sel = document.getElementById('si-product');
  document.getElementById('save-stockin').onclick = async () => {
    const pid = sel.value;
    const qty = parseInt(document.getElementById('si-qty').value) || 0;
    if(qty<=0){ showToast(t('toast_enter_qty')); return; }
    const priceVal = document.getElementById('si-price').value;
    const costVal = document.getElementById('si-cost').value;
    const p = state.products.find(x=>x.id===pid);
    if(!p) return;

    const oldPrice = p.price;
    const oldCostPrice = p.costPrice || 0;
    const newPrice = (priceVal && parseFloat(priceVal)>0) ? parseFloat(priceVal) : oldPrice;
    const newCostPrice = (costVal && parseFloat(costVal)>0) ? parseFloat(costVal) : oldCostPrice;

    p.stock += qty;
    p.price = newPrice;
    p.costPrice = newCostPrice;

    if(newPrice!==oldPrice || newCostPrice!==oldCostPrice){
      state.priceChanges.push({
        id: uid(), date: nowISO(), productId: p.id, productName: p.name,
        oldPrice, newPrice, oldCostPrice, newCostPrice
      });
    }

    let supplierName = '';
    const supSel = document.getElementById('si-supplier');
    const supText = document.getElementById('si-supplier-text');
    if(supSel && supSel.value){ const sp = state.suppliers.find(x=>x.id===supSel.value); supplierName = sp?sp.name:''; }
    else if(supText){ supplierName = supText.value.trim(); }
    state.stockIns.push({id:uid(), date:nowISO(), productId:pid, productName:p.name, qty, supplier:supplierName});
    if(supplierName && newCostPrice>0){
      state.purchases.push({
        id: uid(), date: nowISO(), productId: pid, productName: p.name,
        qty, costPrice: newCostPrice, totalCost: newCostPrice*qty, paidAmount: 0,
        supplier: supplierName, payment: siPayment, status: siPayment==='debt' ? 'debt' : 'paid'
      });
    }
    await saveData();
    closeSheet();
    render();
    showToast(`${t('toast_stockin_done_prefix')}${qty} ${t('unit_suffix')}`);
  };
}

      refresh();
    }));

      const purchaseId = b.dataset.id;
      removePurchaseFromSupplierPayments(purchaseId);

async function confirmSale(){
  const cartItems = Object.entries(cart).filter(([,q])=>q>0);
  if(cartItems.length===0) return;
  const confirmBtnEl = document.getElementById('confirm-sale');
  if(confirmBtnEl){
    if(confirmBtnEl.disabled) return;
    confirmBtnEl.disabled = true;
  }
  const items = cartItems.map(([pid,q])=>{
    const p = state.products.find(x=>x.id===pid);
    return {productId:pid, name:p.name, price:p.price, qty:q};
  });
  const subtotal = items.reduce((s,i)=>s+i.price*i.qty,0);
  const discountAmount = discountType==='percent'
    ? Math.round(subtotal * (Math.min(discountValue,100)/100))
    : Math.min(discountValue, subtotal);
  const total = Math.max(0, subtotal - discountAmount);
  const customer = (document.getElementById('customer-name')?.value || '').trim();

  const priorDebt = customer
    ? state.sales.filter(s=>(s.customer||'').trim()===customer && s.status==='debt').reduce((s,x)=>s+saleOutstanding(x),0)
    : 0;

  items.forEach(i=>{
    const p = state.products.find(x=>x.id===i.productId);
    if(p) p.stock = Math.max(0, p.stock - i.qty);
  });

  const paidNow = payMethod==='debt' ? Math.max(0, Math.min(parseFloat(paidNowValue)||0, total)) : 0;

  const sale = {
    id: uid(),
    orderNumber: ++state.orderCounter,
    date: nowISO(),
    customer,
    items,
    subtotal,
    discountType: discountAmount>0 ? discountType : null,
    discountValue: discountAmount>0 ? discountValue : 0,
    discountAmount,
    total,
    paidAmount: paidNow,
    payment: payMethod,
    status: (payMethod==='debt' && paidNow<total) ? 'debt' : 'paid'
  };
  state.sales.push(sale);

  await saveData();
  cart = {};
  payMethod = 'cash';
  discountType = 'percent';
  discountValue = 0;
  paidNowValue = '';
  window._customerDraft = '';
  salesSubTab = 'history';
  render();
  openReceiptSheet(sale, priorDebt);
}

function buildReceiptText(sale, priorDebt){
  const lines = [];
  const client = sale.customer ? state.clients.find(c=>c.name.trim()===sale.customer.trim()) : null;
  const grandDebtAfter = priorDebt + saleOutstanding(sale);
  lines.push(`${t('invoice_title_prefix')}${sale.orderNumber}`);
  lines.push(state.settings.shopPhone ? `${state.settings.shopName} (${state.settings.shopPhone})` : state.settings.shopName);
  if(sale.customer) lines.push(`${t('buyer_label')} ${sale.customer}`);
  if(client && client.phone) lines.push(`${t('phone_number_label')} ${client.phone}`);
  lines.push(`${t('comment_label')} ${grandDebtAfter>0 ? t('comment_debt_label')+' '+fmt(grandDebtAfter) : t('comment_paid_label')}`);
  lines.push(`${t('order_number_label')} №${sale.orderNumber} ${t('order_date_join')} ${new Date(sale.date).toLocaleDateString('ru-RU')}`);
  lines.push('');
  sale.items.forEach((i,idx)=>{
    lines.push(`${idx+1}. ${i.name} — ${i.qty} ${t('unit_suffix')} x ${fmt(i.price)} = ${fmt(i.qty*i.price)}`);
  });
  lines.push('');
  if(sale.discountAmount>0){
    lines.push(`${t('subtotal_label')}: ${fmt(sale.subtotal)}`);
    const discLabel = sale.discountType==='percent' ? `${sale.discountValue}%` : fmt(sale.discountValue);
    lines.push(`${t('discount_label')} (${discLabel}): −${fmt(sale.discountAmount)}`);
  }
  lines.push(`${t('goods_subtotal_label')}: ${fmt(sale.subtotal||sale.total)}`);
  lines.push(`${t('grand_total_label')}: ${fmt(sale.total)}`);
  const payLabel = sale.payment==='cash' ? t('pay_cash') : sale.payment==='card' ? t('pay_card') : t('pay_debt');
  lines.push(`${t('receipt_payment_prefix')} ${payLabel}`);
  const totalQty = sale.items.reduce((s,i)=>s+i.qty,0);
  lines.push('');
  lines.push(t('invoice_summary')(totalQty, fmt(sale.total)));
  if(priorDebt>0){
    lines.push('');
    lines.push(`${t('receipt_prior_debt_prefix')} ${fmt(priorDebt)}`);
    lines.push(`${t('receipt_new_order_prefix')} ${fmt(sale.total)}`);
    lines.push(`${t('receipt_grand_total_prefix')} ${fmt(priorDebt+sale.total)}`);
  }
  return lines.join('\n');
}

/* ---------------- Real PDF generation (no external library) ----------------
   Canvas text rendering uses the system font, so Cyrillic works correctly —
   standard PDF fonts (Helvetica etc.) don't support Cyrillic without embedding
   a font file, so instead we render the receipt as an image and wrap that
   image in a minimal hand-built single-page PDF (JPEG via the DCTDecode
   filter, which every PDF viewer supports natively). */
function textToBytes(str){
  const arr = new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) arr[i] = str.charCodeAt(i) & 0xFF;
  return arr;
}
function concatBytes(chunks){
  let total = 0;
  chunks.forEach(c=>{ total += c.length; });
  const result = new Uint8Array(total);
  let offset = 0;
  chunks.forEach(c=>{ result.set(c, offset); offset += c.length; });
  return result;
}

function renderInvoiceCanvas(sale, priorDebt){
  const padding = 28;
  const width = 700;
  const client = sale.customer ? state.clients.find(c=>c.name.trim()===sale.customer.trim()) : null;
  const grandDebtAfter = priorDebt + saleOutstanding(sale);
  const tableLeft = padding, tableRight = width - padding;
  const cols = [
    {key:'num',   label:t('table_header_num'),   x:tableLeft,      w:34,  align:'left'},
    {key:'model', label:t('table_header_model'), x:tableLeft+34,   w:240, align:'left'},
    {key:'unit',  label:t('table_header_unit'),  x:tableLeft+274,  w:60,  align:'center'},
    {key:'qty',   label:t('table_header_qty'),   x:tableLeft+334,  w:60,  align:'center'},
    {key:'price', label:t('table_header_price'), x:tableLeft+394,  w:130, align:'right'},
    {key:'sum',   label:t('table_header_sum'),   x:tableLeft+524,  w:118, align:'right'},
  ];

  const headerLines = [
    {text: `${t('invoice_title_prefix')}${sale.orderNumber}`, bold:true, size:19, center:true},
    {text: '', size:8},
    {text: state.settings.shopPhone ? `${state.settings.shopName} (${state.settings.shopPhone})` : state.settings.shopName, size:13},
  ];
  if(sale.customer) headerLines.push({text:`${t('buyer_label')} ${sale.customer}`, size:13});
  if(client && client.phone) headerLines.push({text:`${t('phone_number_label')} ${client.phone}`, size:13});
  headerLines.push({text:`${t('comment_label')} ${grandDebtAfter>0 ? t('comment_debt_label')+' '+fmt(grandDebtAfter) : t('comment_paid_label')}`, size:13, color: grandDebtAfter>0 ? '#AE3B26' : '#14532D'});
  headerLines.push({text:`${t('order_number_label')} №${sale.orderNumber} ${t('order_date_join')} ${new Date(sale.date).toLocaleDateString('ru-RU')}`, size:13});

  const rowHeight = 26;
  let headerHeight = padding;
  headerLines.forEach(l=>{ headerHeight += (l.size||13) + 8; });
  headerHeight += 8;

  const totalRows = sale.items.length + 2; // items + subtotal row + grand total row
  const canvasHeight = headerHeight + rowHeight*(1+totalRows) + 60;

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = Math.max(canvasHeight, 320);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textBaseline = 'top';

  let y = padding;
  headerLines.forEach(l=>{
    if(l.text){
      ctx.font = `${l.bold?'bold ':''}${l.size||13}px Arial, sans-serif`;
      ctx.fillStyle = l.color || '#141414';
      if(l.center){
        ctx.textAlign = 'center';
        ctx.fillText(l.text, canvas.width/2, y);
        ctx.textAlign = 'left';
      } else {
        ctx.fillText(l.text, padding, y);
      }
    }
    y += (l.size||13) + 8;
  });
  y += 8;

  function drawRow(vals, opts){
    opts = opts || {};
    if(opts.bold) ctx.font = `bold ${opts.size||12}px Arial, sans-serif`;
    else ctx.font = `${opts.size||12}px Arial, sans-serif`;
    ctx.fillStyle = opts.color || '#141414';
    cols.forEach(c=>{
      const val = vals[c.key];
      if(val===undefined || val===null) return;
      ctx.textAlign = c.align;
      const tx = c.align==='right' ? c.x+c.w : c.align==='center' ? c.x+c.w/2 : c.x;
      ctx.fillText(String(val), tx, y);
    });
    ctx.textAlign = 'left';
  }

  // table header row
  drawRow(cols.reduce((o,c)=>{ o[c.key]=c.label; return o; },{}), {bold:true, size:12});
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(tableLeft, y+rowHeight-6); ctx.lineTo(tableRight, y+rowHeight-6); ctx.stroke();
  y += rowHeight;

  // item rows
  sale.items.forEach((item,idx)=>{
    drawRow({num:idx+1, model:item.name, unit:t('unit_suffix'), qty:item.qty, price:fmt(item.price), sum:fmt(item.qty*item.price)});
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tableLeft, y+rowHeight-8); ctx.lineTo(tableRight, y+rowHeight-8); ctx.stroke();
    y += rowHeight;
  });

  // subtotal row
  drawRow({model:t('goods_subtotal_label'), sum:fmt(sale.subtotal||sale.total)});
  y += rowHeight;

  // grand total row (bold, with a top rule)
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(tableLeft, y-4); ctx.lineTo(tableRight, y-4); ctx.stroke();
  drawRow({model:t('grand_total_label'), sum:fmt(sale.total)}, {bold:true, size:13});
  y += rowHeight + 16;

  const totalQty = sale.items.reduce((s,i)=>s+i.qty,0);
  ctx.font = '12px Arial, sans-serif';
  ctx.fillStyle = '#444';
  ctx.fillText(t('invoice_summary')(totalQty, fmt(sale.total)), padding, y);

  return canvas;
}

function canvasToPdfBlob(canvas){
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  const base64 = dataUrl.split(',')[1];
  const jpegBytes = textToBytes(atob(base64));
  const W = canvas.width, H = canvas.height;
  const enc = new TextEncoder();
  const parts = [];
  const offsets = {};
  let pos = 0;
  function push(strOrBytes){
    const bytes = (strOrBytes instanceof Uint8Array) ? strOrBytes : enc.encode(strOrBytes);
    parts.push(bytes);
    pos += bytes.length;
  }
  push('%PDF-1.4\n');
  offsets[1] = pos; push(`1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n`);
  offsets[2] = pos; push(`2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n`);
  offsets[3] = pos; push(`3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n`);
  offsets[4] = pos; push(`4 0 obj<</Type/XObject/Subtype/Image/Width ${W}/Height ${H}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpegBytes.length}>>stream\n`);
  push(jpegBytes);
  push(`\nendstream endobj\n`);
  const contentStream = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  offsets[5] = pos; push(`5 0 obj<</Length ${contentStream.length}>>stream\n${contentStream}\nendstream endobj\n`);
  const xrefStart = pos;
  let xref = `xref\n0 6\n0000000000 65535 f \n`;
  for(let i=1;i<=5;i++) xref += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  xref += `trailer<</Size 6/Root 1 0 R>>\nstartxref\n${xrefStart}\n%%EOF`;
  push(xref);
  return new Blob([concatBytes(parts)], {type:'application/pdf'});
}

async function shareReceiptAsPDF(sale, priorDebt=0){
  try{
    const canvas = renderInvoiceCanvas(sale, priorDebt);
    const blob = canvasToPdfBlob(canvas);
    const filename = `nakladnaya-${sale.orderNumber}.pdf`;
    const file = (typeof File!=='undefined') ? new File([blob], filename, {type:'application/pdf'}) : null;
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: state.settings.shopName});
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    showToast(t('toast_pdf_share_unsupported'));
  } catch(e){
    if(e && e.name==='AbortError') return;
    console.error('shareReceiptAsPDF failed:', e);
    showToast(t('toast_generic_error'));
  }
}

/* ---------------- Render dispatch ---------------- */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart==='number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==='number' ? active.selectionEnd : null;
  const scrollY = window.scrollY;

  renderBottomNav();
  renderDate();
  const el = document.getElementById('app-content');
  if(currentTab==='dashboard') el.innerHTML = renderDashboard();
  else if(currentTab==='inventory') el.innerHTML = renderInventory();
  else if(currentTab==='sales') el.innerHTML = renderSales();
  else if(currentTab==='clients') el.innerHTML = renderClients();
  else if(currentTab==='debts') el.innerHTML = renderDebts();
  bindEvents();

  if(activeId){
    const revived = document.getElementById(activeId);
    if(revived && typeof revived.focus==='function'){
      revived.focus({preventScroll:true});
      if(selStart!==null && revived.setSelectionRange){
        try{ revived.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
  window.scrollTo(0, scrollY);
}

function bindEvents(){

  el.querySelectorAll('[data-action="new-sale"]').forEach(b=>b.addEventListener('click', ()=>{
    currentTab='sales'; salesSubTab='new'; render();
  }));
  el.querySelectorAll('[data-action="edit-sale"]').forEach(row=>{
    row.addEventListener('click', ()=>openEditSaleSheet(row.dataset.id));
  });
  el.querySelectorAll('[data-action="add-product"]').forEach(b=>b.addEventListener('click', ()=>openAddProductSheet(null)));
  el.querySelectorAll('[data-action="stock-in"]').forEach(b=>b.addEventListener('click', openStockInSheet));
  el.querySelectorAll('[data-action="open-return"]').forEach(b=>b.addEventListener('click', openReturnPickSheet));
  el.querySelectorAll('[data-action="add-expense"]').forEach(b=>b.addEventListener('click', openExpenseSheet));
  el.querySelectorAll('[data-action="add-withdrawal"]').forEach(b=>b.addEventListener('click', openWithdrawalSheet));
  el.querySelectorAll('[data-kassatab]').forEach(b=>b.addEventListener('click', ()=>{ kassaSubTab=b.dataset.kassatab; render(); }));
  el.querySelectorAll('[data-reporttab]').forEach(b=>b.addEventListener('click', ()=>{ reportSubTab=b.dataset.reporttab; render(); }));
  el.querySelectorAll('[data-action="toggle-report-client"]').forEach(row=>row.addEventListener('click', ()=>{
    const name = decodeURIComponent(row.dataset.name);
    if(expandedReportClients.has(name)) expandedReportClients.delete(name);
    else expandedReportClients.add(name);
    render();
  }));
  el.querySelectorAll('[data-action="add-client"]').forEach(b=>b.addEventListener('click', ()=>openAddClientSheet(null)));
  el.querySelectorAll('[data-action="add-supplier"]').forEach(b=>b.addEventListener('click', ()=>openAddSupplierSheet(null)));
  el.querySelectorAll('[data-clientstab]').forEach(b=>b.addEventListener('click', ()=>{ clientsSubTab=b.dataset.clientstab; clientSearch=''; render(); }));
  el.querySelectorAll('[data-action="edit-supplier"]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const s = state.suppliers.find(x=>x.id===row.dataset.id);
      if(s) openAddSupplierSheet(s);
    });
  });
  el.querySelectorAll('[data-action="goto-sales-history"]').forEach(b=>b.addEventListener('click', ()=>{
    currentTab='sales'; salesSubTab='history'; render();
  }));

  const searchInput = document.getElementById('inv-search');
  if(searchInput){
    searchInput.addEventListener('input', e=>{ invSearch = e.target.value; render(); });
  }

  el.querySelectorAll('[data-action="edit-product"]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const p = state.products.find(x=>x.id===row.dataset.id);
      if(p) openAddProductSheet(p);
    });
  });

  const clientSearchInput = document.getElementById('client-search');
  if(clientSearchInput){
    clientSearchInput.addEventListener('input', e=>{ clientSearch = e.target.value; render(); });
  }
  el.querySelectorAll('[data-action="open-client"]').forEach(row=>{
    row.addEventListener('click', ()=>{ openClientSheet(decodeURIComponent(row.dataset.key)); });
  });

  const subtabs = el.querySelectorAll('[data-subtab]');
  subtabs.forEach(b=>b.addEventListener('click', ()=>{ salesSubTab=b.dataset.subtab; render(); }));

  el.querySelectorAll('[data-action="cart-inc"]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.dataset.id;
    const p = state.products.find(x=>x.id===id);
    const cur = cart[id]||0;
    if(p && cur < p.stock) cart[id] = cur+1;
    else if(!p) cart[id] = cur+1;
    else showToast(t('toast_low_stock'));
    saveCustomerDraft();
    render();
  }));
  el.querySelectorAll('[data-action="cart-dec"]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.dataset.id;
    cart[id] = Math.max(0, (cart[id]||0)-1);
    saveCustomerDraft();
    render();
  }));

  el.querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click', ()=>{
    payMethod = b.dataset.pay;
    saveCustomerDraft();
    render();
  }));

  const custInput = document.getElementById('customer-name');
  const custSuggestions = document.getElementById('customer-suggestions');
  if(custInput){
    custInput.addEventListener('input', e=>{
      window._customerDraft = e.target.value;
      if(!custSuggestions) return;
      const q = e.target.value.trim().toLowerCase();
      if(!q){ custSuggestions.style.display = 'none'; custSuggestions.innerHTML = ''; return; }
      const names = [...new Set(customerStats().map(c=>c.name))]
        .filter(n=>n!==t('no_name_client') && n.toLowerCase().includes(q))
        .slice(0, 6);
      if(names.length===0){ custSuggestions.style.display = 'none'; custSuggestions.innerHTML = ''; return; }
      custSuggestions.innerHTML = names.map(n=>`
        <div class="cust-suggestion" data-name="${n}" style="padding:10px 14px; cursor:pointer; font-size:13.5px; border-bottom:1px solid var(--border);">${n}</div>
      `).join('');
      custSuggestions.style.display = 'block';
      custSuggestions.querySelectorAll('.cust-suggestion').forEach(row=>{
        row.addEventListener('click', ()=>{
          custInput.value = row.dataset.name;
          window._customerDraft = row.dataset.name;
          custSuggestions.style.display = 'none';
          custSuggestions.innerHTML = '';
        });
      });
    });
    custInput.addEventListener('blur', ()=>{
      setTimeout(()=>{ if(custSuggestions){ custSuggestions.style.display = 'none'; } }, 150);
    });
  }
  const pickClientBtn = document.getElementById('pick-client-btn');
  if(pickClientBtn) pickClientBtn.addEventListener('click', ()=>openPickClientSheet());

  const discountInput = document.getElementById('discount-value');
  if(discountInput){
    discountInput.addEventListener('input', e=>{
      discountValue = Math.max(0, parseFloat(e.target.value) || 0);
      render();
    });
  }
  document.querySelectorAll('[data-discount-type]').forEach(b=>b.addEventListener('click', ()=>{
    discountType = b.dataset.discountType;
    render();
  }));
  const paidNowInput = document.getElementById('paid-now-input');
  if(paidNowInput){
    paidNowInput.addEventListener('input', e=>{
      paidNowValue = e.target.value;
      render();
    });
  }

  const confirmBtn = document.getElementById('confirm-sale');
  if(confirmBtn) confirmBtn.addEventListener('click', confirmSale);

  document.querySelectorAll('[data-action="ask-delete-cash"]').forEach(b=>b.addEventListener('click', ()=>{
    confirmCashDelete = {kind: b.dataset.kind, id: b.dataset.id};
    render();
  }));
  document.querySelectorAll('[data-action="cancel-delete-cash"]').forEach(b=>b.addEventListener('click', ()=>{
    confirmCashDelete = null;
    render();
  }));
  document.querySelectorAll('[data-action="confirm-delete-cash"]').forEach(b=>b.addEventListener('click', async ()=>{
    const kind = b.dataset.kind, id = b.dataset.id;
    if(kind==='expense') state.expenses = state.expenses.filter(x=>x.id!==id);
    else if(kind==='withdrawal') state.withdrawals = state.withdrawals.filter(x=>x.id!==id);
    else if(kind==='debtIn') await undoDebtPayment(id);
    else if(kind==='supplierOut') await undoSupplierPayment(id);
    if(kind==='expense' || kind==='withdrawal') await saveData();
    confirmCashDelete = null;
    render();
    showToast(t('toast_cash_entry_deleted'));
  }));

  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeSheet(); };
}

/* Pull-to-refresh: only triggers when already scrolled to the very top and
   no sheet is open, so it never fights with normal scrolling or a modal's
   own scroll area. Pulling past the threshold reloads the page — the same
   action as the hamburger menu's "Жаңылоо" button. */
(function setupPullToRefresh(){
  const indicator = document.getElementById('pull-refresh-indicator');
  const threshold = 70;
  let startY = null;
  let pulling = false;

  document.addEventListener('touchstart', (e)=>{
    const overlayOpen = document.getElementById('overlay').classList.contains('open');
    if(overlayOpen || window.scrollY > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    pulling = true;
  }, {passive:true});

  document.addEventListener('touchmove', (e)=>{
    if(!pulling || startY===null) return;
    const diff = e.touches[0].clientY - startY;
    if(diff <= 0) return;
    const pull = Math.min(diff, threshold*1.6);
    const progress = Math.min(pull/threshold, 1);
    indicator.style.transform = `translateX(-50%) translateY(${-60 + pull}px) rotate(${progress*360}deg)`;
  }, {passive:true});

  document.addEventListener('touchend', (e)=>{
    if(!pulling || startY===null){ pulling = false; return; }
    const diff = (e.changedTouches[0].clientY - startY);
    pulling = false;
    startY = null;
    if(diff >= threshold){
      indicator.style.transform = `translateX(-50%) translateY(16px)`;
      setTimeout(()=>window.location.reload(), 150);
    } else {
      indicator.style.transform = `translateX(-50%) translateY(-60px)`;
    }
  }, {passive:true});
})();

/* Registers the service worker only when this file is actually served over
   http(s) from a real host — registration would just fail (harmlessly) if
   attempted inside Claude's sandboxed preview or opened via file://, so this
   guard keeps the console clean in both places. */
if('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(e=>{
      console.log('Service worker registration skipped:', e.message);
    });
  });
}
</script>
